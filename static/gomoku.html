<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17231f" />
    <meta name="description" content="支持人机与在线房间对战的五子棋" />
    <title>弈 · 五子棋</title>
    <link rel="stylesheet" href="/style.css?v=20261111.2" />
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div class="brand-lockup">
          <a class="back-home" href="/" aria-label="返回游戏大厅">←</a>
          <h1>弈 · 五子棋</h1>
          <span class="brand-subtitle">GOMOKU</span>
        </div>
        <button class="icon-button sound-button muted" id="soundButton" type="button" aria-label="播放背景音乐" aria-pressed="false" title="播放背景音乐">
          <span aria-hidden="true" class="sound-on">♫</span>
          <span aria-hidden="true" class="sound-off">♪</span>
        </button>
      </header>

      <section class="game-layout" aria-label="五子棋游戏">
        <div class="board-panel">
          <div class="turn-banner" id="turnBanner" role="status" aria-live="polite">
            <span class="turn-main"><span class="stone mini black" aria-hidden="true"></span><span id="turnText">黑方先行</span></span>
            <span class="move-counter">第 <strong id="moveCount">0</strong> 手</span>
          </div>
          <div class="board-wrap">
            <div id="board" class="board" role="grid" aria-label="15乘15五子棋棋盘"></div>
          </div>
          <div class="board-footer" aria-hidden="true">
            <span>十五路棋盘</span>
            <span class="board-footer-mark">弈</span>
            <span>五子连珠</span>
          </div>
        </div>

        <aside class="control-panel">
          <p class="section-label">对局模式</p>
          <div class="mode-picker" aria-label="对局模式">
            <button class="mode active" type="button" data-mode="ai">
              <span class="mode-icon" aria-hidden="true">机</span>
              <span><strong>人机对弈</strong><small>挑战电脑白棋</small></span>
            </button>
            <button class="mode" type="button" data-mode="online">
              <span class="mode-icon" aria-hidden="true">联</span>
              <span><strong>在线对弈</strong><small>输入房间号加入</small></span>
            </button>
          </div>

          <section class="online-panel" id="onlinePanel" hidden aria-label="在线房间">
            <div id="roomEntry">
              <button class="create-room-button" id="createRoom" type="button">
                <span><strong>创建新房间</strong><small>你执黑，等待朋友加入</small></span>
                <span aria-hidden="true">＋</span>
              </button>
              <div class="join-divider"><span>或输入房间号</span></div>
              <div class="join-room-form">
                <input id="roomCodeInput" type="text" inputmode="text" maxlength="6" autocomplete="off" placeholder="例如 7K9MHF" aria-label="六位房间号" />
                <button id="joinRoom" type="button">加入</button>
              </div>
              <p class="room-error" id="roomError" role="alert"></p>
            </div>
            <div class="room-lobby" id="roomLobby" hidden>
              <div>
                <p class="section-label">当前房间</p>
                <button class="room-code" id="roomCode" type="button" title="复制房间号">------</button>
              </div>
              <div class="room-lobby-status">
                <span class="connection-dot" id="connectionDot"></span>
                <span id="roomStatus">等待对方加入</span>
              </div>
              <button class="copy-invite" id="copyInvite" type="button">复制邀请链接</button>
            </div>
          </section>

          <section class="difficulty-section" id="difficultySection" aria-labelledby="difficultyTitle">
            <div class="setting-heading">
              <p class="section-label" id="difficultyTitle">电脑难度</p>
              <span id="difficultyHint">攻守均衡</span>
            </div>
            <div class="difficulty-picker" role="group" aria-label="电脑难度">
              <button type="button" data-difficulty="easy" aria-pressed="false"><strong>入门</strong><small>轻松落子</small></button>
              <button class="active" type="button" data-difficulty="normal" aria-pressed="true"><strong>普通</strong><small>攻守均衡</small></button>
              <button type="button" data-difficulty="hard" aria-pressed="false"><strong>困难</strong><small>谨慎预判</small></button>
            </div>
          </section>

          <div class="score-card">
            <div class="player-row active" id="blackPlayer">
              <span class="stone black" aria-hidden="true"></span>
              <div><strong>黑方</strong><small id="blackLabel">你</small></div>
              <span class="player-tag">先手</span>
            </div>
            <div class="divider"><span>对</span></div>
            <div class="player-row" id="whitePlayer">
              <span class="stone white" aria-hidden="true"></span>
              <div><strong>白方</strong><small id="whiteLabel">电脑 · 普通</small></div>
              <span class="thinking" id="thinking">思考中…</span>
            </div>
          </div>

          <div class="actions">
            <button class="primary-button" id="newGame" type="button"><span>新对局</span><span aria-hidden="true">↻</span></button>
            <button class="secondary-button" id="undoButton" type="button" disabled>悔一步</button>
          </div>
          <p class="shortcut">电脑端可按 <kbd>R</kbd> 快速重开</p>
        </aside>
      </section>
    </main>

    <div class="dialog-backdrop" id="dialog" hidden>
      <section class="result-dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <span class="result-mark" id="resultMark">胜</span>
        <p class="eyebrow">本局已结束</p>
        <h2 id="resultTitle">黑方获胜</h2>
        <p id="resultMessage">漂亮的一局，再来一盘？</p>
        <button class="primary-button" id="playAgain" type="button">再来一局</button>
      </section>
    </div>

    <script src="/game.js?v=20261111.2" defer></script>
  </body>
</html>
