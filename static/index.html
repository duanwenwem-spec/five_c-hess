<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#13221d" />
    <meta name="description" content="方寸游局：四款支持单人与好友联机的轻量小游戏" />
    <title>方寸游局 · 选择游戏</title>
    <link rel="stylesheet" href="/hub.css?v=20261113.1" />
  </head>
  <body>
    <main class="hub-shell">
      <header class="hub-header">
        <a class="hub-brand" href="/" aria-label="方寸游局首页">
          <span class="hub-seal" aria-hidden="true">游</span>
          <strong>方寸游局</strong>
        </a>
      </header>

      <section class="game-grid" aria-label="选择游戏">
        <a class="game-card gomoku-card" href="/gomoku.html">
          <div class="card-visual board-preview" aria-hidden="true">
            <span class="preview-stone black one"></span>
            <span class="preview-stone white two"></span>
            <span class="preview-stone black three"></span>
            <span class="preview-stone white four"></span>
            <span class="preview-stone black five"></span>
          </div>
          <div class="card-content">
            <h2>五子棋</h2>
            <p>人机对弈，或创建房间和朋友下棋。</p>
            <span class="enter-game">开始 <b aria-hidden="true">→</b></span>
          </div>
        </a>

        <a class="game-card bomb-card" href="/bomb.html">
          <div class="card-visual bomb-preview" aria-hidden="true">
            <span class="number-card n1">18</span>
            <span class="number-card n2">42</span>
            <span class="number-card n3">73</span>
            <span class="bomb-orb"><i></i></span>
            <span class="range-line">1 — 100</span>
          </div>
          <div class="card-content">
            <h2>数字炸弹</h2>
            <p>轮流猜数并缩小范围，猜中炸弹的人输。</p>
            <span class="enter-game">开始 <b aria-hidden="true">→</b></span>
          </div>
        </a>

        <a class="game-card draw-card" href="/draw.html">
          <div class="card-visual draw-preview" aria-hidden="true">
            <svg viewBox="0 0 240 320"><circle cx="112" cy="112" r="53"/><path d="M83 112 Q112 140 141 112 M94 94 L101 88 M123 88 L130 94 M49 245 Q117 190 192 225 M143 205 C165 180 179 153 193 123"/><path d="M183 130 L201 109 L196 139"/></svg>
            <span>猜猜这是什么？</span>
          </div>
          <div class="card-content">
            <h2>你画我猜</h2>
            <p>看图猜词，或和朋友轮流画、轮流猜。</p>
            <span class="enter-game">开始 <b aria-hidden="true">→</b></span>
          </div>
        </a>

        <a class="game-card coin-card" href="/coin.html">
          <div class="card-visual coin-preview" aria-hidden="true">
            <span class="hub-coin hc1">¥</span><span class="hub-coin hc2">★</span><span class="hub-coin hc3">¥</span>
            <span class="hub-bomb"><i></i>!</span><span class="hub-basket"></span>
          </div>
          <div class="card-content">
            <h2>接金币</h2>
            <p>接住金币、避开炸弹，也可以和朋友比分。</p>
            <span class="enter-game">开始 <b aria-hidden="true">→</b></span>
          </div>
        </a>
      </section>
    </main>
    <script>
      const legacyParams = new URLSearchParams(location.search);
      if (legacyParams.has("room") || legacyParams.has("online")) location.replace(`/gomoku.html${location.search}`);
    </script>
  </body>
</html>
